services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./api:/app
      - api-uploads:/app/uploads
    depends_on:
      - mongo
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mongo-data:
  api-uploads:
