<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10306a" />

    <title>Spacio — Storage space from real people near you</title>
    <meta
      name="description"
      content="Spacio is a peer-to-peer storage marketplace. Book only the square footage you need, from identity-verified local hosts, with optional secure boxes and declared-value insurance."
    />

    <!-- No true vector source exists for this logo (it started as a raster
         export), so this is PNG-only rather than SVG+PNG fallback — see
         docs/DOCUMENTATION.md §10/§11. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter card: what renders when spacio.cc is pasted
         into Slack, iMessage, or a recruiter's inbox. Images must be
         absolute URLs for crawlers to fetch them. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spacio.cc/" />
    <meta property="og:title" content="Spacio — Storage space from real people near you" />
    <meta
      property="og:description"
      content="Book only the square footage you need, from identity-verified local hosts. Save up to 50% versus traditional storage units."
    />
    <meta property="og:image" content="https://spacio.cc/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spacio — Storage space from real people near you" />
    <meta
      name="twitter:description"
      content="Book only the square footage you need, from identity-verified local hosts. Save up to 50% versus traditional storage units."
    />
    <meta name="twitter:image" content="https://spacio.cc/og-image.png" />
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
