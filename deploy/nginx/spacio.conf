# nginx site config for spacio.cc — installed on the EC2 host (not in
# Docker) so certbot can manage the cert with the standard nginx plugin.
# Frontend and API are served from the same origin (this host) so the
# session cookie (Host-only, no explicit Domain) needs no cross-site
# handling — see docs/DOCUMENTATION.md §3 (JWT/cookie auth).
#
# Install: copy to /etc/nginx/sites-available/spacio.conf, then
#   ln -s /etc/nginx/sites-available/spacio.conf /etc/nginx/sites-enabled/
#   rm /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# Then run certbot (see deploy/DEPLOY.md) — it rewrites the 443 block below
# in place the first time it runs.

server {
    listen 80;
    listen [::]:80;
    server_name spacio.cc www.spacio.cc;
    return 301 https://spacio.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spacio.cc www.spacio.cc;

    # Filled in by certbot --nginx on first run; placeholders so `nginx -t`
    # doesn't fail before certbot has run.
    ssl_certificate /etc/letsencrypt/live/spacio.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spacio.cc/privkey.pem;

    # Slightly above the app's own 5MB cap (MAX_UPLOAD_BYTES in
    # app/routers/listings.py) so nginx never rejects a request before the
    # app gets a chance to return its own 413 with a clear message.
    client_max_body_size 6M;

    # Every FastAPI router prefix (see api/main.py's include_router calls)
    # plus the two static mounts (/uploads, /images) goes to the API
    # container; everything else falls through to the React build below.
    location ~ ^/(auth|listings|reservations|messages|pricing|matching|payments|reviews|verification|uploads|images)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/spacio;
        try_files $uri /index.html;
    }
}
